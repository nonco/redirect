<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Alerts</title>
    <style>
        /* Force the core body container to sit flush edge-to-edge */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; position: relative; }
        
        /* Render the running application underneath the mask layer */
        iframe { border: none; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }
        
        /* Create a full-width structural shield across the entire bottom edge */
        .branding-shield {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;        /* Stretches edge-to-edge to block the entire footer bar */
            height: 50px;       /* Covers the full vertical height profile of the banner */
            background-color: #ffffff; /* Matches your core UI background perfectly */
            z-index: 999999;    /* Floats directly over top of the iframe contents */
            pointer-events: auto; /* Solidifies the mouse interception wall */
        }
    </style>
</head>
<body>

    <div class="branding-shield"></div>

    <iframe src="https://honolulu-property-alerts.streamlit.app/?embed=true&embed_options=hide_loading_screen"></iframe>

</body>
</html>
